<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <h1>TASTY</h1>
                </div>
                <nav class="navigation">
                    <a href="#" class="nav-link active">Home</a>
                    <a href="#" class="nav-link">Menu</a>
                    <a href="#" class="nav-link">Service</a>
                </nav>
                <div class="header-buttons">
                    <button class="btn-register">Register</button>
                    <button class="btn-login">Login</button>
                </div>
            </div>
        </div>
    </header>

    <section class="hero">
        <div class="container">
            <div class="hero-content">
                <div class="hero-left">
                    <h2 class="hero-title">
                        <span class="orange-text">Meat, Eat & Enjoy</span>
                        <span class="black-text">the true taste</span>
                    </h2>
                    <p class="hero-description">
                        Lorem ipsum dolor sit amet consectetur. Maecenas nunc et sollicitudin odio purus dictumst mauris
                        enim
                    </p>
                    <a
                        href="https://preview.redd.it/big-monke-flips-you-off-what-u-do-v0-861gk9gqka0c1.png?auto=webp&s=4ffd6a12783c45e1a56bb7c19a57ead83aaa4f33"><button
                            class="btn-see-more">SEE MORE</button></a>
                    <div class="search-box">
                        <input type="text" placeholder="Search Food..." class="search-input">
                    </div>
                    <div class="social-icons">
                        <a href="https://www.instagram.com/tastyfood.uz/" class="social-link"><img
                                src="./img/instagram.png" alt=""></a>
                        <a href="https://www.facebook.com/tastyfoodgroup/" class="social-link"><img
                                src="./img/facebook.png" alt=""></a>
                        <a href="https://x.com/tasty" class="social-link"><img src="./img/twitter.png" alt=""></a>
                    </div>
                </div>
                <div class="hero-right">
                    <div class="image-circle">
                        <img src="./img/zadniy fon.png" alt="Delicious Salad">
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
